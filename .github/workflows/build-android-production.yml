name: Build Production APK

on:
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: android-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  PNPM_VERSION: "9"

jobs:
  build:
    name: "Build Production APK"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      # ── Setup ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @repo/shared build

      # ── Java / Gradle ──────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Prebuild ───────────────────────────────────────────────────────
      - name: Write .env file
        working-directory: apps/mobile
        run: |
          cat > .env << EOF
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_ADMIN_API_URL=${{ secrets.EXPO_PUBLIC_ADMIN_API_URL }}
          EXPO_PUBLIC_ADMOB_BANNER_AD_UNIT_ID=${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_AD_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_REWARD_AD_UNIT_ID=${{ secrets.EXPO_PUBLIC_ADMOB_REWARD_AD_UNIT_ID }}
          EOF

      - name: Generate native Android project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean

      # ── Build APK ──────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --no-daemon

      # ── Sign release APK ───────────────────────────────────────────────
      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing APK with release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

            UNSIGNED_APK=$(find apps/mobile/android -name "*.apk" -path "*/release/*" | head -1)
            if [ -z "$UNSIGNED_APK" ]; then
              echo "No release APK found"
              exit 1
            fi

            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            APKSIGNER="$BUILD_TOOLS/apksigner"
            ZIPALIGN="$BUILD_TOOLS/zipalign"

            ALIGNED_APK="/tmp/app-aligned.apk"
            "$ZIPALIGN" -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

            SIGNED_APK="/tmp/app-signed.apk"
            "$APKSIGNER" sign \
              --ks /tmp/release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"

            cp "$SIGNED_APK" "$UNSIGNED_APK"
            echo "APK signed successfully"
          else
            echo "No signing keystore provided"
            exit 1
          fi

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Find APK file
        id: find-apk
        run: |
          APK_PATH=$(find apps/mobile/android -name "*.apk" -path "*/release/*" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-${{ github.sha }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      # ── Summary ────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## Production Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Firebase** | prompt-view-e59bc |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | com.promptgallery.app |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | \`${{ steps.find-apk.outputs.apk_path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from **Actions** > **Artifacts**." >> $GITHUB_STEP_SUMMARY
