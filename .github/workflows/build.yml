name: Build Android APK (Legacy)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Write .env file
        working-directory: apps/mobile
        run: |
          cat > .env << EOF
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_ADMIN_API_URL=${{ secrets.EXPO_PUBLIC_ADMIN_API_URL }}
          EXPO_PUBLIC_ADMOB_BANNER_AD_UNIT_ID=${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_AD_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_REWARD_AD_UNIT_ID=${{ secrets.EXPO_PUBLIC_ADMOB_REWARD_AD_UNIT_ID }}
          EOF

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: inputs.build_type == 'release'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
