name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - dev
          - release
        default: dev

# Cancel in-progress runs for the same branch
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  PNPM_VERSION: "9"

jobs:
  build:
    name: "Build ${{ inputs.build_type }} APK"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.build_type == 'release' && 'production' || 'dev' }}

    steps:
      # ── Setup ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @repo/shared build

      # ── Java / Gradle ──────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Prebuild ───────────────────────────────────────────────────────
      - name: Write .env file
        working-directory: apps/mobile
        run: |
          cat > .env << EOF
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_ADMIN_API_URL=${{ secrets.EXPO_PUBLIC_ADMIN_API_URL }}
          EXPO_PUBLIC_ADMOB_BANNER_AD_UNIT_ID=${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_AD_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_REWARD_AD_UNIT_ID=${{ secrets.EXPO_PUBLIC_ADMOB_REWARD_AD_UNIT_ID }}
          EOF

      - name: Generate native Android project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean

      # ── Configure build ────────────────────────────────────────────────
      - name: Set build variables
        id: build-vars
        run: |
          if [ "${{ inputs.build_type }}" = "dev" ]; then
            echo "BUILD_CMD=assembleDebug" >> $GITHUB_OUTPUT
            echo "APK_PATTERN=**/*.apk" >> $GITHUB_OUTPUT
            echo "ARTIFACT_NAME=app-dev-debug" >> $GITHUB_OUTPUT
            echo "FIREBASE_USE_EMULATOR=1" >> $GITHUB_OUTPUT
          else
            echo "BUILD_CMD=assembleRelease" >> $GITHUB_OUTPUT
            echo "APK_PATTERN=**/*.apk" >> $GITHUB_OUTPUT
            echo "ARTIFACT_NAME=app-release" >> $GITHUB_OUTPUT
            echo "FIREBASE_USE_EMULATOR=0" >> $GITHUB_OUTPUT
          fi

      # ── Build APK ──────────────────────────────────────────────────────
      - name: Build Android APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.build-vars.outputs.BUILD_CMD }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --no-daemon

      # ── Sign release APK (optional — requires secrets) ─────────────────
      - name: Sign release APK
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing APK with release keystore..."
            # Decode keystore
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

            # Find the unsigned APK
            UNSIGNED_APK=$(find apps/mobile/android -name "*.apk" -path "*/release/*" | head -1)
            if [ -z "$UNSIGNED_APK" ]; then
              echo "No release APK found, skipping signing"
              exit 0
            fi

            # Find build-tools
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            APKSIGNER="$BUILD_TOOLS/apksigner"
            ZIPALIGN="$BUILD_TOOLS/zipalign"

            # Zipalign
            ALIGNED_APK="/tmp/app-aligned.apk"
            "$ZIPALIGN" -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

            # Sign
            SIGNED_APK="/tmp/app-signed.apk"
            "$APKSIGNER" sign \
              --ks /tmp/release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"

            # Replace unsigned with signed
            cp "$SIGNED_APK" "$UNSIGNED_APK"
            echo "APK signed successfully"
          else
            echo "No signing keystore provided, building unsigned APK"
          fi

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Find APK file
        id: find-apk
        run: |
          if [ "${{ inputs.build_type }}" = "dev" ]; then
            APK_PATH=$(find apps/mobile/android -name "*.apk" -path "*/debug/*" | head -1)
          else
            APK_PATH=$(find apps/mobile/android -name "*.apk" -path "*/release/*" | head -1)
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-vars.outputs.ARTIFACT_NAME }}-${{ github.sha }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14
          if-no-files-found: error

      # ── Summary ────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## 🤖 Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | \`${{ inputs.build_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | \`${{ steps.find-apk.outputs.apk_path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the APK from the **Actions** → **Artifacts** section." >> $GITHUB_STEP_SUMMARY
