name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - dev
          - release
        default: dev
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - preview
          - production
        default: development

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  build:
    name: "Build ${{ inputs.build_type }} IPA"
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      # ── Setup ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── CocoaPods cache ────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      # ── Prebuild ───────────────────────────────────────────────────────
      - name: Generate native iOS project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --clean

      # ── Install CocoaPods ──────────────────────────────────────────────
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      # ── Configure signing ──────────────────────────────────────────────
      - name: Setup iOS signing
        if: inputs.build_type == 'release'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ]; then
            # Create temporary keychain
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # Import certificate
            CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
            echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            security import "$CERTIFICATE_PATH" \
              -P "$IOS_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: \
              -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # Import provisioning profile
            PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
            cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

            echo "iOS signing configured"
          else
            echo "No signing certificates provided, building for simulator"
          fi

      # ── Determine scheme and destination ────────────────────────────────
      - name: Set build variables
        id: build-vars
        run: |
          if [ "${{ inputs.build_type }}" = "dev" ]; then
            echo "SCHEME=PromptGallery" >> $GITHUB_OUTPUT
            echo "CONFIGURATION=Debug" >> $GITHUB_OUTPUT
            echo "DESTINATION=generic/platform=iOS" >> $GITHUB_OUTPUT
            echo "ARCHIVE_ACTION=archive" >> $GITHUB_OUTPUT
            echo "ARTIFACT_NAME=app-dev" >> $GITHUB_OUTPUT
          else
            echo "SCHEME=PromptGallery" >> $GITHUB_OUTPUT
            echo "CONFIGURATION=Release" >> $GITHUB_OUTPUT
            echo "DESTINATION=generic/platform=iOS" >> $GITHUB_OUTPUT
            echo "ARCHIVE_ACTION=archive" >> $GITHUB_OUTPUT
            echo "ARTIFACT_NAME=app-release" >> $GITHUB_OUTPUT
          fi

      # ── Build & Archive ────────────────────────────────────────────────
      - name: Build iOS archive
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace PromptGallery.xcworkspace \
            -scheme ${{ steps.build-vars.outputs.SCHEME }} \
            -configuration ${{ steps.build-vars.outputs.CONFIGURATION }} \
            -destination "${{ steps.build-vars.outputs.DESTINATION }}" \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -allowProvisioningUpdates \
            clean archive | xcpretty

      # ── Export IPA ─────────────────────────────────────────────────────
      - name: Export IPA
        if: inputs.build_type == 'release'
        working-directory: apps/mobile/ios
        run: |
          # Create export options
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Build dev IPA (simulator)
        if: inputs.build_type == 'dev'
        working-directory: apps/mobile/ios
        run: |
          # For dev builds, create a zip of the .app for simulator
          APP_PATH=$(find $RUNNER_TEMP/app.xcarchive/Products -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            cd $RUNNER_TEMP/app.xcarchive/Products
            zip -r $RUNNER_TEMP/app-dev.zip *.app
          fi

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-vars.outputs.ARTIFACT_NAME }}-${{ github.sha }}
          path: |
            ${{ steps.build_type == 'release' && '$RUNNER_TEMP/export/*.ipa' || '$RUNNER_TEMP/app-dev.zip' }}
          retention-days: 14
          if-no-files-found: warn

      # ── Cleanup keychain ───────────────────────────────────────────────
      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      # ── Summary ────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## 🍎 iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | \`${{ inputs.build_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Scheme** | \`${{ steps.build-vars.outputs.SCHEME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the build from the **Actions** → **Artifacts** section." >> $GITHUB_STEP_SUMMARY
