# This app is part of the monorepo root workspace.
# Workspace config is in the root pnpm-workspace.yaml.

allowBuilds:
  '@firebase/util': true
  protobufjs: true
  unrs-resolver: true
# Where pnpm 10.16 and newer read settings from — .npmrc now carries only auth
# and registry keys. See .npmrc for why Expo needs a flat node_modules.
nodeLinker: hoisted
